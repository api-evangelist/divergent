aid: divergent
name: Divergent
description: 'Divergent Technologies, Inc. is a Torrance and Long Beach, California
  manufacturer that built the Divergent Adaptive Production System (DAPS), an end-to-end
  software-hardware production system for industrial digital manufacturing. DAPS pairs
  AI-driven generative design software with in-house metal additive manufacturing —
  the Monolith One printer, compatible with aluminum, nickel, steel and titanium alloys
  — and automated fixtureless robotic assembly, so complex multi-part structures can
  be engineered, printed and assembled without fixed tooling. Founded in 2013 by Kevin
  and Lukas Czinger, the company is a Tier 1 supplier to global automotive OEMs and
  has expanded into aerospace and defense, including selection under the US Air Force
  Eglin Wide Agile Acquisition Contract. Divergent sells manufactured structures and
  production capacity, not software: it publishes no developer portal, no public API,
  and no machine-readable contract of any kind.'
